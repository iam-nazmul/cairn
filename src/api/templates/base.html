<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}cairn{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml" />

    <!-- Play CDN: compiles Tailwind in the browser, so there is no node build step
         in a Python repo. It needs network access and is not meant for production
         traffic -- src/api/README.md has the two-command swap to a compiled sheet. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      /* Manual toggle instead of prefers-color-scheme alone, so the choice sticks. */
      @custom-variant dark (&:where(.dark, .dark *));

      @theme {
        --color-cairn-50: oklch(0.98 0.01 180);
        --color-cairn-100: oklch(0.94 0.03 180);
        --color-cairn-300: oklch(0.82 0.09 182);
        --color-cairn-500: oklch(0.68 0.12 184);
        --color-cairn-600: oklch(0.58 0.11 186);
        --color-cairn-700: oklch(0.47 0.09 188);
        --font-display: "Georgia", ui-serif, serif;
      }

      /* Answers arrive whole after one model call, so fade them in rather than
         letting a wall of text snap into place. */
      @keyframes rise {
        from { opacity: 0; transform: translateY(0.35rem); }
        to { opacity: 1; transform: none; }
      }
      .animate-rise { animation: rise 0.18s ease-out both; }

      .scroll-slim::-webkit-scrollbar { width: 0.5rem; }
      .scroll-slim::-webkit-scrollbar-thumb {
        border-radius: 9999px;
        background: color-mix(in oklch, currentColor 20%, transparent);
      }
    </style>
    <script>
      // Before first paint: a flash of the wrong theme is worse than no toggle.
      try {
        const saved = localStorage.getItem("cairn.theme");
        const dark = saved
          ? saved === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body
    class="h-full bg-stone-100 text-stone-800 antialiased dark:bg-stone-950 dark:text-stone-200"
  >
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', path='/app.js') }}" type="module"></script>
  </body>
</html>
