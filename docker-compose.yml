# Postgres for ENV=prod: one database backs BOTH the checkpointer and the Store
# (SPEC §11, resolved in M3). pgvector is present for the Store's semantic index.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - cairn-pgdata:/var/lib/postgresql/data

volumes:
  cairn-pgdata:
